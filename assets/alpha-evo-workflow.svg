<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Overall Architecture of Alpha Evo</title>
  <desc id="desc">A concise fourteen-step architecture. The top row moves from the research contract through one-time initialization, candidate realization, BRAIN simulation, and eligibility. The bottom row moves from submission through dynamic memory, feedback, mutation, crossover, and the governed factor pool. Evolution candidates loop back to candidate realization rather than initial planning.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#18243a"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#70539a"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#18243a" flood-opacity="0.10"/>
    </filter>
    <style>
      .canvas { fill: #ffffff; }
      .title { font-family: Georgia, 'Times New Roman', serif; font-size: 42px; font-weight: 700; fill: #0d1421; text-anchor: middle; }
      .subtitle { font-family: Arial, sans-serif; font-size: 17px; fill: #657080; text-anchor: middle; }
      .stage { stroke-width: 1.4; }
      .stage-init { fill: #f4f8ed; stroke: #7d9a67; }
      .stage-realize { fill: #eef8f7; stroke: #5d9690; }
      .stage-eval { fill: #edf5fc; stroke: #5d83a7; }
      .stage-memory { fill: #fff9e9; stroke: #b59a46; }
      .stage-evolve { fill: #f7f1fb; stroke: #9071aa; }
      .stage-title { font-family: Georgia, 'Times New Roman', serif; font-size: 21px; font-weight: 700; font-style: italic; text-anchor: middle; }
      .stage-rule { stroke-width: 1.2; stroke-dasharray: 6 5; }
      .node { stroke: #243149; stroke-width: 1.5; filter: url(#shadow); }
      .node-neutral { fill: #ffffff; }
      .node-init { fill: #fbfdf8; }
      .node-realize { fill: #f8fdfc; }
      .node-eval { fill: #f7fbff; }
      .node-memory { fill: #fffdf6; }
      .node-evolve { fill: #fcf9fe; }
      .node-result { fill: #fff7f6; stroke: #a56560; }
      .badge { fill: #102c50; }
      .badge-text { font-family: Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .node-title { font-family: Georgia, 'Times New Roman', serif; font-size: 18px; font-weight: 700; fill: #131a28; text-anchor: middle; }
      .node-copy { font-family: Arial, sans-serif; font-size: 14px; fill: #445064; text-anchor: middle; }
      .node-rule { stroke: #8b95a5; stroke-width: 1; stroke-dasharray: 5 4; }
      .flow { fill: none; stroke: #18243a; stroke-width: 2.3; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #70539a; stroke-width: 2.6; marker-end: url(#arrow-purple); }
      .memory-link { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 7 6; marker-end: url(#arrow-dash); }
      .edge-label { font-family: Georgia, 'Times New Roman', serif; font-size: 16px; font-weight: 700; font-style: italic; text-anchor: middle; }
      .core { fill: #ffffff; stroke: #667085; stroke-width: 1.4; stroke-dasharray: 8 6; }
      .core-title { font-family: Georgia, 'Times New Roman', serif; font-size: 18px; font-weight: 700; fill: #1d2939; }
      .core-copy { font-family: Arial, sans-serif; font-size: 15px; fill: #475467; }
      .legend-box { fill: #ffffff; stroke: #667085; stroke-width: 1.2; }
      .legend-title { font-family: Georgia, 'Times New Roman', serif; font-size: 17px; font-weight: 700; fill: #1d2939; text-anchor: middle; }
      .legend-copy { font-family: Arial, sans-serif; font-size: 13px; fill: #475467; }
    </style>
  </defs>

  <rect class="canvas" width="1800" height="1120"/>
  <text class="title" x="900" y="52">Overall Architecture of Alpha Evo</text>
  <text class="subtitle" x="900" y="82">Governed WorldQuant BRAIN research with trajectory-level feedback and controlled evolution</text>

  <!-- Stage containers -->
  <rect class="stage stage-init" x="275" y="120" width="430" height="326" rx="18"/>
  <text class="stage-title" x="490" y="151" fill="#55713e">Initialization Stage</text>
  <line class="stage-rule" x1="405" y1="164" x2="575" y2="164" stroke="#55713e"/>

  <rect class="stage stage-realize" x="715" y="120" width="430" height="326" rx="18"/>
  <text class="stage-title" x="930" y="151" fill="#39726d">Candidate Realization</text>
  <line class="stage-rule" x1="842" y1="164" x2="1018" y2="164" stroke="#39726d"/>

  <rect class="stage stage-eval" x="1155" y="120" width="430" height="326" rx="18"/>
  <text class="stage-title" x="1370" y="151" fill="#416f99">BRAIN Evaluation</text>
  <line class="stage-rule" x1="1290" y1="164" x2="1450" y2="164" stroke="#416f99"/>

  <rect class="stage stage-memory" x="1150" y="605" width="435" height="245" rx="18"/>
  <text class="stage-title" x="1368" y="836" fill="#8d7629">Evaluation &amp; Memory</text>

  <rect class="stage stage-evolve" x="275" y="605" width="870" height="245" rx="18"/>
  <text class="stage-title" x="710" y="836" fill="#72518f">Feedback &amp; Evolution</text>

  <!-- Top row nodes -->
  <g>
    <rect class="node node-neutral" x="30" y="190" width="220" height="215" rx="14"/>
    <circle class="badge" cx="55" cy="215" r="16"/><text class="badge-text" x="55" y="215">1</text>
    <text class="node-title" x="140" y="244"><tspan x="140">Research Contract</tspan><tspan x="140" dy="23">&amp; Authority</tspan></text>
    <line class="node-rule" x1="52" y1="303" x2="228" y2="303"/>
    <text class="node-copy" x="140" y="334"><tspan x="140">scope · budget · permissions</tspan><tspan x="140" dy="22">private-state boundary</tspan></text>
  </g>

  <g>
    <rect class="node node-init" x="285" y="190" width="200" height="215" rx="14"/>
    <circle class="badge" cx="310" cy="215" r="16"/><text class="badge-text" x="310" y="215">2</text>
    <text class="node-title" x="385" y="244"><tspan x="385">Account &amp;</tspan><tspan x="385" dy="23">Field Sync</tspan></text>
    <line class="node-rule" x1="307" y1="303" x2="463" y2="303"/>
    <text class="node-copy" x="385" y="334"><tspan x="385">ACTIVE memory</tspan><tspan x="385" dy="22">typed field catalog</tspan></text>
  </g>

  <g>
    <rect class="node node-init" x="495" y="190" width="200" height="215" rx="14"/>
    <circle class="badge" cx="520" cy="215" r="16"/><text class="badge-text" x="520" y="215">3</text>
    <text class="node-title" x="595" y="244"><tspan x="595">Initial Hypothesis</tspan><tspan x="595" dy="23">Planning</tspan></text>
    <line class="node-rule" x1="517" y1="303" x2="673" y2="303"/>
    <text class="node-copy" x="595" y="334"><tspan x="595">10 directions · once</tspan><tspan x="595" dy="22">mechanism + proxies</tspan></text>
  </g>

  <g>
    <rect class="node node-realize" x="725" y="190" width="200" height="215" rx="14"/>
    <circle class="badge" cx="750" cy="215" r="16"/><text class="badge-text" x="750" y="215">4</text>
    <text class="node-title" x="825" y="244"><tspan x="825">Candidate Contract</tspan><tspan x="825" dy="23">&amp; FastExpr</tspan></text>
    <line class="node-rule" x1="747" y1="303" x2="903" y2="303"/>
    <text class="node-copy" x="825" y="334"><tspan x="825">expression · settings</tspan><tspan x="825" dy="22">operation · lineage</tspan></text>
  </g>

  <g>
    <rect class="node node-realize" x="935" y="190" width="200" height="215" rx="14"/>
    <circle class="badge" cx="960" cy="215" r="16"/><text class="badge-text" x="960" y="215">5</text>
    <text class="node-title" x="1035" y="244"><tspan x="1035">Static Validation</tspan><tspan x="1035" dy="23">&amp; Dry Run</tspan></text>
    <line class="node-rule" x1="957" y1="303" x2="1113" y2="303"/>
    <text class="node-copy" x="1035" y="334"><tspan x="1035">fields · semantics</tspan><tspan x="1035" dy="22">complexity · redundancy</tspan></text>
  </g>

  <g>
    <rect class="node node-eval" x="1165" y="190" width="200" height="215" rx="14"/>
    <circle class="badge" cx="1190" cy="215" r="16"/><text class="badge-text" x="1190" y="215">6</text>
    <text class="node-title" x="1265" y="244"><tspan x="1265">BRAIN</tspan><tspan x="1265" dy="23">Simulation</tspan></text>
    <line class="node-rule" x1="1187" y1="303" x2="1343" y2="303"/>
    <text class="node-copy" x="1265" y="334"><tspan x="1265">IS metrics + checks</tspan><tspan x="1265" dy="22">dated daily PnL</tspan></text>
  </g>

  <g>
    <rect class="node node-eval" x="1375" y="190" width="200" height="215" rx="14"/>
    <circle class="badge" cx="1400" cy="215" r="16"/><text class="badge-text" x="1400" y="215">7</text>
    <text class="node-title" x="1475" y="244"><tspan x="1475">Eligibility &amp;</tspan><tspan x="1475" dy="23">Correlation Gate</tspan></text>
    <line class="node-rule" x1="1397" y1="303" x2="1553" y2="303"/>
    <text class="node-copy" x="1475" y="334"><tspan x="1475">WQ checks + coverage</tspan><tspan x="1475" dy="22">|daily PnL corr| &lt; 0.70</tspan></text>
  </g>

  <!-- Main top flow -->
  <path class="flow" d="M250 298 L281 298"/>
  <path class="flow" d="M485 298 L491 298"/>
  <path class="flow" d="M695 298 L721 298"/>
  <path class="flow" d="M925 298 L931 298"/>
  <path class="flow" d="M1135 298 L1161 298"/>
  <path class="flow" d="M1365 298 L1371 298"/>

  <!-- Right turn -->
  <path class="flow" d="M1575 298 L1685 298 L1685 616"/>

  <!-- Bottom row: right to left -->
  <g>
    <rect class="node node-memory" x="1590" y="620" width="190" height="170" rx="14"/>
    <circle class="badge" cx="1615" cy="645" r="16"/><text class="badge-text" x="1615" y="645">8</text>
    <text class="node-title" x="1685" y="674"><tspan x="1685">Controlled</tspan><tspan x="1685" dy="22">Submission</tspan></text>
    <line class="node-rule" x1="1612" y1="725" x2="1758" y2="725"/>
    <text class="node-copy" x="1685" y="754">ACTIVE = success</text>
  </g>

  <g>
    <rect class="node node-memory" x="1375" y="620" width="190" height="170" rx="14"/>
    <circle class="badge" cx="1400" cy="645" r="16"/><text class="badge-text" x="1400" y="645">9</text>
    <text class="node-title" x="1470" y="674"><tspan x="1470">Dynamic PnL</tspan><tspan x="1470" dy="22">Memory</tspan></text>
    <line class="node-rule" x1="1397" y1="725" x2="1543" y2="725"/>
    <text class="node-copy" x="1470" y="754">ACTIVE + pool + batch</text>
  </g>

  <g>
    <rect class="node node-memory" x="1160" y="620" width="190" height="170" rx="14"/>
    <circle class="badge" cx="1185" cy="645" r="16"/><text class="badge-text" x="1185" y="645">10</text>
    <text class="node-title" x="1255" y="674"><tspan x="1255">Trajectory</tspan><tspan x="1255" dy="22">Evaluation</tspan></text>
    <line class="node-rule" x1="1182" y1="725" x2="1328" y2="725"/>
    <text class="node-copy" x="1255" y="754">reward + state + lineage</text>
  </g>

  <g>
    <rect class="node node-evolve" x="945" y="620" width="190" height="170" rx="14"/>
    <circle class="badge" cx="970" cy="645" r="16"/><text class="badge-text" x="970" y="645">11</text>
    <text class="node-title" x="1040" y="674"><tspan x="1040">Fault-localized</tspan><tspan x="1040" dy="22">Feedback</tspan></text>
    <line class="node-rule" x1="967" y1="725" x2="1113" y2="725"/>
    <text class="node-copy" x="1040" y="754">one recorded action</text>
  </g>

  <g>
    <rect class="node node-evolve" x="730" y="620" width="190" height="170" rx="14"/>
    <circle class="badge" cx="755" cy="645" r="16"/><text class="badge-text" x="755" y="645">12</text>
    <text class="node-title" x="825" y="674"><tspan x="825">14 Mutation</tspan><tspan x="825" dy="22">Tasks</tspan></text>
    <line class="node-rule" x1="752" y1="725" x2="898" y2="725"/>
    <text class="node-copy" x="825" y="754">evaluate children first</text>
  </g>

  <g>
    <rect class="node node-result" x="30" y="620" width="220" height="170" rx="14"/>
    <circle class="badge" cx="55" cy="645" r="16"/><text class="badge-text" x="55" y="645">14</text>
    <text class="node-title" x="140" y="674"><tspan x="140">Governed</tspan><tspan x="140" dy="22">Factor Pool</tspan></text>
    <line class="node-rule" x1="52" y1="725" x2="228" y2="725"/>
    <text class="node-copy" x="140" y="754">screened + auditable</text>
  </g>

  <g>
    <rect class="node node-evolve" x="285" y="620" width="410" height="170" rx="14"/>
    <circle class="badge" cx="310" cy="645" r="16"/><text class="badge-text" x="310" y="645">13</text>
    <text class="node-title" x="490" y="674"><tspan x="490">Pool Refresh → 6 Crossovers</tspan></text>
    <line class="node-rule" x1="307" y1="704" x2="673" y2="704"/>
    <text class="node-copy" x="490" y="738"><tspan x="490">refresh after Mutation evidence</tspan><tspan x="490" dy="22">then generate complementary children</tspan></text>
  </g>

  <!-- Main bottom flow -->
  <path class="flow" d="M1590 705 L1569 705"/>
  <path class="flow" d="M1375 705 L1354 705"/>
  <path class="flow" d="M1160 705 L1139 705"/>
  <path class="flow" d="M945 705 L924 705"/>
  <path class="flow" d="M730 705 L699 705"/>
  <path class="flow" d="M285 705 L254 705"/>

  <!-- Dynamic memory feeds the gate -->
  <path class="memory-link" d="M1470 620 L1470 410"/>
  <text class="edge-label" x="1560" y="522" fill="#64748b">dynamic references</text>

  <!-- Evolution loop returns to candidate realization, not initialization -->
  <path class="loop" d="M490 620 C490 520 825 525 825 410"/>
  <text class="edge-label" x="690" y="520" fill="#70539a">candidate evaluation loop</text>

  <!-- Core idea -->
  <rect class="core" x="60" y="918" width="1020" height="105" rx="14"/>
  <circle cx="112" cy="970" r="28" fill="#f3f7fc" stroke="#315b87" stroke-width="1.5"/>
  <path d="M101 968 C101 957 109 949 120 949 C131 949 139 957 139 968 C139 976 134 981 129 986 L129 994 L111 994 L111 986 C105 981 101 976 101 968 Z" fill="none" stroke="#315b87" stroke-width="2.2"/>
  <line x1="113" y1="1000" x2="127" y2="1000" stroke="#315b87" stroke-width="2"/>
  <text class="core-title" x="165" y="958">Core idea:</text>
  <text class="core-copy" x="270" y="958"><tspan x="270">The agent proposes bounded research trajectories; deterministic controls evaluate evidence,</tspan><tspan x="165" dy="26">preserve lineage, block redundant submissions, and guide the next Mutation–Crossover cycle.</tspan></text>

  <!-- Legend -->
  <rect class="legend-box" x="1130" y="900" width="610" height="142" rx="14"/>
  <text class="legend-title" x="1435" y="927">Legend</text>
  <rect x="1160" y="950" width="22" height="16" fill="#f4f8ed" stroke="#7d9a67"/><text class="legend-copy" x="1192" y="963">Initialization</text>
  <rect x="1300" y="950" width="22" height="16" fill="#eef8f7" stroke="#5d9690"/><text class="legend-copy" x="1332" y="963">Realization</text>
  <rect x="1445" y="950" width="22" height="16" fill="#edf5fc" stroke="#5d83a7"/><text class="legend-copy" x="1477" y="963">BRAIN</text>
  <rect x="1570" y="950" width="22" height="16" fill="#fff9e9" stroke="#b59a46"/><text class="legend-copy" x="1602" y="963">Memory</text>
  <rect x="1160" y="990" width="22" height="16" fill="#f7f1fb" stroke="#9071aa"/><text class="legend-copy" x="1192" y="1003">Evolution</text>
  <rect x="1300" y="990" width="22" height="16" fill="#fff7f6" stroke="#a56560"/><text class="legend-copy" x="1332" y="1003">Result</text>
  <line x1="1445" y1="999" x2="1485" y2="999" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 6"/><text class="legend-copy" x="1496" y="1003">Dynamic reference</text>
</svg>
